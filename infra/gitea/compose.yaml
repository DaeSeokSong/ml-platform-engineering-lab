services:
  gitea:
    image: docker.gitea.com/gitea:28.2.0
    container_name: ml-platform-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__actions__ENABLED: "true"
      GITEA__server__DISABLE_SSH: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/data
    networks:
      kind:
        aliases:
          - gitea

volumes:
  gitea-data:

networks:
  kind:
    external: true
